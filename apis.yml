aid: spot-runner
name: Spot Runner
description: >-
  Spot Runner is an AI-driven advertising technology company (backed by Battery
  Ventures) focused on contextual media planning for Connected TV (CTV) and
  online video. Its platform uses proprietary MicroModeling AI through tools
  such as ContextPlanner and ContextDeals to match advertiser creative to the
  most relevant, brand-suitable premium video ad opportunities across leading
  streaming networks, publishers, and TV OEMs, and to send Deal IDs directly to
  a buyer's DSP seat. Spot Runner also markets an "Agentic Agency" of multi-agent
  creative tooling for SMBs and DTC brands. The public surface is a marketing
  site plus an advertiser login portal; there is no published developer API,
  OpenAPI, or SDK. The site does expose a hosted Wix Site MCP endpoint for
  agentic AI access, advertised via its /llms.txt.
