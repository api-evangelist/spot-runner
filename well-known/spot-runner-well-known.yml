notes: >-
  Every /.well-known/ path was probed on all four Spot Runner hosts and NOTHING was served.
  No WellKnown or SecurityTxt pointer is wired in apis.yml, because none of these probes
  returned a real document. Two failure shapes are recorded here so a later round does not
  mistake them for hits: www.spotrunner.com is a Wix (Thunderbolt) site that answers HTTP 400
  with an HTML error page for any unknown path, and advertiser.spotrunner.com is a Vite/React
  single-page app whose catch-all answers HTTP 200 with the same 523-byte index.html shell for
  EVERY path — an SPA catch-all, not a document. api.spotrunner.com is a real Express service
  (the advertiser portal backend) that returns "Cannot GET /<path>" for everything except
  /health.
